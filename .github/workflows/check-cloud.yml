name: Check cloud module

on:
  push:
    paths:
      - "overlay/**"
      - ".github/workflows/check-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ours

      - name: Pick latest Ketch release
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/linroid/Ketch/releases --jq '[.[] | select(.tag_name | test("^v[0-9]")) | select(.prerelease | not)][0].tag_name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: linroid/Ketch
          ref: ${{ steps.t.outputs.tag }}
          path: ketch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Add the cloud module
        working-directory: ketch
        run: |
          cp -R ../ours/overlay/. .
          echo 'include(":library:cloud")' >> settings.gradle.kts

      - name: Run tests
        working-directory: ketch
        run: ./gradlew :library:cloud:compileCommonMainKotlinMetadata :library:cloud:jvmTest --no-daemon --continue -PprebuiltWebDir=build/no-web-app

  ios:
    name: iOS compile
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: ours

      - name: Pick latest Ketch release
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/linroid/Ketch/releases --jq '[.[] | select(.tag_name | test("^v[0-9]")) | select(.prerelease | not)][0].tag_name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: linroid/Ketch
          ref: ${{ steps.t.outputs.tag }}
          path: ketch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Add the cloud module
        working-directory: ketch
        run: |
          cp -R ../ours/overlay/. .
          echo 'include(":library:cloud")' >> settings.gradle.kts

      - name: Compile for iOS
        working-directory: ketch
        run: ./gradlew :library:cloud:compileKotlinIosArm64 :library:cloud:compileKotlinIosSimulatorArm64 --no-daemon -PprebuiltWebDir=build/no-web-app

      - name: Run the tests in the iOS simulator
        working-directory: ketch
        run: |
          ./gradlew :library:cloud:iosSimulatorArm64Test --no-daemon --continue -PprebuiltWebDir=build/no-web-app --tests 'com.linroid.ketch.cloud.CloudServiceTest' && exit 0
          echo "CloudServiceTest crashed; running one test at a time"
          for t in a01Context a02Prefs a03Database a04Http b01Quark b02Uc b03Xunlei b04Baidu b05C139 b06Pan123 b07Pan115 b08GuangYa b09ILanzou b10Lanzou b11GitHub; do
            if ./gradlew :library:cloud:iosSimulatorArm64Test --tests "com.linroid.ketch.cloud.BisectTest.$t" -PprebuiltWebDir=build/no-web-app > "/tmp/$t.log" 2>&1; then
              echo "BISECT PASS $t"
            else
              echo "BISECT FAIL $t"
            fi
          done
          exit 1
